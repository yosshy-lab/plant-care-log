<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="植物ケア記録">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./apple-touch-icon.png">
<title>植物ケア記録</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;
  --line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--soft:#eff6ff;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:24px;margin:4px 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.app-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.app-header-main{min-width:0}
.menu-wrap{position:relative;flex:none}
.menu-wrap.open{z-index:30}
.menu-button{font-size:22px;line-height:1;padding:8px 12px;min-width:44px}
.menu-panel{
  position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:210px;
  padding:6px;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 32px rgba(0,0,0,.18)
}
.menu-panel button{
  display:block;width:100%;padding:11px 12px;border-radius:9px;
  background:#fff;color:var(--text);text-align:left;font-size:14px
}
.menu-panel button:active{background:var(--bg)}
.menu-panel button.menu-danger{color:var(--danger)}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.view-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e5e7eb;padding:4px;border-radius:14px;margin-bottom:14px}
.view-switch button{background:transparent;color:var(--muted);padding:9px}
.view-switch button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
button{
  border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;
  background:#111827;color:#fff;cursor:pointer
}
button.secondary{background:#fff;color:#111827;border:1px solid var(--line)}
button.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}
.card{
  background:var(--card);border-radius:16px;padding:15px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)
}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-top-actions{display:flex;align-items:center;gap:5px;align-self:flex-start}
.plant-menu-button{padding:7px 10px;min-width:40px;background:transparent!important;border-color:transparent!important}
.name{font-size:18px;font-weight:800}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.elapsed{font-size:27px;font-weight:900;margin:12px 0 4px}
.elapsed span{font-size:13px;color:var(--muted);font-weight:600}
.care{width:100%;background:var(--accent);font-size:17px;padding:14px;margin-top:10px}
.care-fields[hidden]{display:none}
.check-row{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--text);font-size:14px}
.check-row input{width:auto}
.photo-preview{display:none;width:100%;max-height:240px;object-fit:contain;margin-top:10px;border-radius:12px;background:#f9fafb}
.history-photo{display:block;width:100%;max-height:320px;object-fit:contain;margin-top:9px;border-radius:12px;background:#f9fafb}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.calendar-panel{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calendar-toolbar button{padding:9px 12px}
.calendar-title{font-size:18px;font-weight:800;text-align:center;flex:1}
.calendar-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.weekday{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:5px 0}
.weekday:first-child{color:#dc2626}.weekday:nth-child(7){color:#2563eb}
.calendar-day{
  min-height:70px;padding:5px 3px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--text);font-weight:600;text-align:left;overflow:hidden
}
.calendar-day.other{opacity:.32}.calendar-day.today{border:2px solid var(--accent)}
.calendar-day.selected{background:var(--soft)}
.day-number{display:block;font-size:12px;margin-bottom:4px}
.event-dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.event-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.event-dot.water{background:#2563eb}.event-dot.pesticide{background:#dc2626}
.event-dot.repot{background:#92400e}.event-dot.fertilize{background:#16a34a}
.event-dot.growth{background:#9333ea}.event-dot.planned{background:#fff;border:2px solid #dc2626;width:9px;height:9px}
.photo-mark{font-size:10px;line-height:1}.more-mark{font-size:9px;color:var(--muted)}
.calendar-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:10px 2px}
.legend-item{display:flex;align-items:center;gap:4px}
.day-details{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.day-details h3{margin:0 0 8px;font-size:16px}
.calendar-entry{padding:9px 0;border-bottom:1px solid var(--line)}
.calendar-entry:last-child{border-bottom:0}
.entry-title{font-weight:800;font-size:14px}.entry-meta{font-size:12px;color:var(--muted);margin-top:3px}
.hidden{display:none!important}
@media(max-width:420px){.calendar-day{min-height:62px}.calendar-panel{padding:9px}.calendar-filters{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.badge{background:var(--soft);color:#1d4ed8;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}
dialog{
  width:min(92vw,520px);border:0;border-radius:18px;padding:0;
  box-shadow:0 20px 60px rgba(0,0,0,.25)
}
dialog::backdrop{background:rgba(0,0,0,.35)}
.modal{padding:18px}
.modal h2{margin:0 0 14px;font-size:20px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 6px}
input,select,textarea{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;background:#fff
}
textarea{min-height:76px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1}
.history-item{padding:10px 0;border-bottom:1px solid var(--line)}
.history-item:last-child{border-bottom:0}
.history-title{font-weight:700}
.history-note{font-size:13px;color:var(--muted);margin-top:3px}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:#111827;color:#fff;padding:11px 14px;
  border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.2s;z-index:1000;max-width:90vw;text-align:center
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div class="app-header-main">
      <h1>🌿 植物ケア記録</h1>
      <div class="sub">植物ごとのお世話を、このブラウザ内に記録できます。</div>
    </div>
    <div class="menu-wrap" id="menuWrap">
      <button class="secondary menu-button" id="menuBtn" aria-label="メニュー" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu-panel" id="dataMenu" role="menu" hidden>
        <button id="exportBtn" role="menuitem">バックアップを保存</button>
        <button id="importBtn" role="menuitem">バックアップから復元</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button id="addBtn">＋ 植物を追加</button>
  </div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <div class="view-switch">
    <button id="listViewBtn" class="active">一覧</button>
    <button id="calendarViewBtn">カレンダー</button>
  </div>

  <div id="listView"><div id="plants"></div></div>
  <div id="calendarView" class="hidden">
    <div class="calendar-panel">
      <div class="calendar-toolbar">
        <button class="secondary" id="prevMonth" aria-label="前の月">‹</button>
        <div id="calendarTitle" class="calendar-title"></div>
        <button class="secondary" id="nextMonth" aria-label="次の月">›</button>
      </div>
      <div class="calendar-filters">
        <select id="calendarPlantFilter" aria-label="植物で絞り込み"></select>
        <select id="calendarCareFilter" aria-label="ケアの種類で絞り込み">
          <option value="">すべてのケア</option>
          <option>水やり</option><option>薬剤散布</option><option>植え替え</option>
          <option>施肥</option><option>状態・写真記録</option>
        </select>
      </div>
      <button class="secondary" id="todayBtn">今日へ戻る</button>
      <div class="calendar-legend">
        <span class="legend-item"><i class="event-dot water"></i>水やり</span>
        <span class="legend-item"><i class="event-dot pesticide"></i>薬剤</span>
        <span class="legend-item"><i class="event-dot repot"></i>植え替え</span>
        <span class="legend-item"><i class="event-dot fertilize"></i>施肥</span>
        <span class="legend-item"><i class="event-dot growth"></i>状態・写真</span>
        <span class="legend-item"><i class="event-dot planned"></i>予定</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div id="calendarDayDetails" class="day-details"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<dialog id="plantDialog">
  <div class="modal">
    <h2>植物を追加</h2>
    <label>植物名</label>
    <input id="plantName" placeholder="例：パキポディウム ①">
    <label>区分</label>
    <select id="plantStage">
      <option>成株</option>
      <option>実生</option>
      <option>播種</option>
    </select>
    <label>種類（任意）</label>
    <input id="plantType" placeholder="例：Pachypodium densicaule">
    <div class="actions">
      <button class="secondary" id="cancelPlant">キャンセル</button>
      <button id="savePlant">追加</button>
    </div>
  </div>
</dialog>

<dialog id="careDialog">
  <div class="modal">
    <h2 id="careTitle">ケア記録</h2>
    <label>ケアの種類</label>
    <select id="careType">
      <option>水やり</option>
      <option>薬剤散布</option>
      <option>植え替え</option>
      <option>施肥</option>
      <option>状態・写真記録</option>
    </select>
    <div id="waterFields" class="care-fields">
      <label>水やり方法</label>
      <select id="waterType">
        <option>たっぷり灌水</option>
        <option>通常</option>
        <option>軽く水やり</option>
        <option>霧吹き</option>
      </select>
      <label>液肥</label>
      <select id="fertilizer">
        <option>なし</option>
        <option>あり</option>
      </select>
      <label>水の量（任意）</label>
      <input id="waterAmount" placeholder="例：鉢底から流れるまで、200ml">
    </div>
    <div id="pesticideFields" class="care-fields" hidden>
      <label>薬剤名</label>
      <input id="pesticideName" placeholder="例：ベニカXファインスプレー">
      <label>対象</label>
      <input id="pesticideTarget" placeholder="例：ハダニ、カイガラムシ、殺菌">
      <label>希釈倍率（任意）</label>
      <input id="pesticideDilution" placeholder="例：1000倍、原液">
      <label>使用方法</label>
      <select id="pesticideMethod">
        <option>散布</option>
        <option>灌注</option>
        <option>塗布</option>
        <option>その他</option>
      </select>
      <label>次回予定日（任意）</label>
      <input id="pesticideNextDate" type="date">
    </div>
    <div id="repotFields" class="care-fields" hidden>
      <label>鉢の種類（任意）</label>
      <input id="potType" placeholder="例：プレステラ、スリット鉢">
      <label>鉢サイズ（任意）</label>
      <input id="potSize" placeholder="例：90、3号">
      <label>用土の配合（任意）</label>
      <textarea id="soilMix" placeholder="例：赤玉4、軽石4、鹿沼2"></textarea>
      <label class="check-row"><input id="rootPruned" type="checkbox">根切り・根整理をした</label>
      <label>植え替え理由（任意）</label>
      <input id="repotReason" placeholder="例：鉢増し、根詰まり、用土交換">
    </div>
    <div id="fertilizeFields" class="care-fields" hidden>
      <label>肥料名</label>
      <input id="fertilizerName" placeholder="例：ハイポネックス、マグァンプK">
      <label>種類</label>
      <select id="fertilizerForm">
        <option>液肥</option>
        <option>置き肥</option>
        <option>元肥</option>
        <option>その他</option>
      </select>
      <label>希釈倍率・使用量（任意）</label>
      <input id="fertilizerAmount" placeholder="例：2000倍、3粒">
    </div>
    <div id="growthFields" class="care-fields" hidden>
      <label>高さ（任意）</label>
      <input id="plantHeight" inputmode="decimal" placeholder="例：12cm">
      <label>幹・茎の太さ（任意）</label>
      <input id="trunkWidth" inputmode="decimal" placeholder="例：4.5cm">
      <label>葉数（任意）</label>
      <input id="leafCount" inputmode="numeric" placeholder="例：18枚">
      <label>写真（任意）</label>
      <input id="carePhoto" type="file" accept="image/*">
      <div class="hint">写真は保存容量を抑えるため自動で縮小・圧縮します。</div>
      <img id="photoPreview" class="photo-preview" alt="選択した写真のプレビュー">
    </div>
    <label>メモ（任意）</label>
    <textarea id="waterNote" placeholder="例：朝に灌水、植え替え後の状態良好"></textarea>
    <div class="actions">
      <button class="secondary" id="cancelCare">キャンセル</button>
      <button id="saveCare">記録する</button>
    </div>
  </div>
</dialog>

<dialog id="historyDialog">
  <div class="modal">
    <h2 id="historyTitle">履歴</h2>
    <div id="historyList"></div>
    <div class="actions"><button id="closeHistory">閉じる</button></div>
  </div>
</dialog>

<script>
const KEY='plant-care-log-v1';
const LEGACY_KEYS=['pachypodium-water-log-v2','pachypodium-water-log-v1'];

function readStoredData(key){
  const value=localStorage.getItem(key);
  if(!value) return null;
  try{
    const parsed=JSON.parse(value);
    return parsed && Array.isArray(parsed.plants) ? parsed : null;
  }catch(e){
    console.warn(`保存データを読み込めませんでした: ${key}`, e);
    return null;
  }
}

function loadData(){
  const current=readStoredData(KEY);
  if(current) return current;

  for(const legacyKey of LEGACY_KEYS){
    const legacy=readStoredData(legacyKey);
    if(legacy){
      localStorage.setItem(KEY, JSON.stringify(legacy));
      return legacy;
    }
  }

  return {plants:[]};
}

let data=loadData();
let currentId=null;
const $=id=>document.getElementById(id);

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
    render();
    return true;
  }catch(e){
    alert('保存容量がいっぱいです。不要な写真や記録を削除してから、もう一度お試しください。');
    return false;
  }
}
function toast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function esc(s=''){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(ts){
  if(!ts) return '記録なし';
  const d=new Date(ts);
  return new Intl.DateTimeFormat('ja-JP',{
    year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'
  }).format(d);
}
function elapsed(ts){
  if(!ts) return {main:'未記録',sub:'最初のケアを記録してください'};
  const diff=Date.now()-ts;
  const days=Math.floor(diff/86400000);
  const hours=Math.floor(diff/3600000);
  const mins=Math.floor(diff/60000);
  if(days>=1) return {main:`${days}日`,sub:'前回のケアから'};
  if(hours>=1) return {main:`${hours}時間`,sub:'前回のケアから'};
  return {main:`${Math.max(0,mins)}分`,sub:'前回のケアから'};
}

function render(){
  const root=$('plants');
  if(!data.plants.length){
    root.innerHTML='<div class="card empty">まだ植物がありません。<br>「＋ 植物を追加」から登録してください。</div>';
    renderCalendarFilters();
    if(!$('calendarView').classList.contains('hidden')) renderCalendar();
    return;
  }
  root.innerHTML=data.plants.map(p=>{
    const last=p.logs?.[0];
    const e=elapsed(last?.time);
    return `<div class="card">
      <div class="row">
        <div>
          <div class="name">${esc(p.name)}</div>
          <div class="meta">${esc(p.stage || '成株')}${p.type?` ・ ${esc(p.type)}`:''}</div>
        </div>
        <div class="card-top-actions">
          <span class="badge">${p.logs?.length||0}回</span>
          <div class="menu-wrap" data-plant-menu>
            <button class="secondary menu-button plant-menu-button" id="plantMenuBtn-${p.id}"
              aria-label="${esc(p.name)}のメニュー" aria-haspopup="true" aria-expanded="false"
              onclick="togglePlantMenu('${p.id}',event)">⋯</button>
            <div class="menu-panel" id="plantMenu-${p.id}" role="menu" hidden>
              <button role="menuitem" onclick="closePlantMenus();showHistory('${p.id}')">履歴を見る</button>
              <button role="menuitem" onclick="closePlantMenus();copyShortcutUrl('${p.id}')">水やりショートカットURL</button>
              <button class="menu-danger" role="menuitem" onclick="closePlantMenus();removePlant('${p.id}')">この株を削除</button>
            </div>
          </div>
        </div>
      </div>
      <div class="elapsed">${e.main} <span>${e.sub}</span></div>
      <div class="meta">前回：${fmtDate(last?.time)}</div>
      <button class="care" onclick="openCare('${p.id}')">＋ ケアを記録</button>
    </div>`;
  }).join('');
  renderCalendarFilters();
  if(!$('calendarView').classList.contains('hidden')) renderCalendar();
}

$('addBtn').onclick=()=>{
  $('plantName').value='';
  $('plantStage').value='成株';
  $('plantType').value='';
  $('plantDialog').showModal();
};
$('cancelPlant').onclick=()=> $('plantDialog').close();
$('savePlant').onclick=()=>{
  const name=$('plantName').value.trim();
  if(!name) return alert('植物名を入力してください');
  data.plants.push({
    id:crypto.randomUUID(),
    name,
    stage:$('plantStage').value,
    type:$('plantType').value.trim(),
    logs:[]
  });
  $('plantDialog').close();
  save();
};

const CARE_FIELD_IDS={
  '水やり':'waterFields',
  '薬剤散布':'pesticideFields',
  '植え替え':'repotFields',
  '施肥':'fertilizeFields',
  '状態・写真記録':'growthFields'
};

function toggleCareFields(){
  Object.values(CARE_FIELD_IDS).forEach(id=>$(id).hidden=true);
  const selected=CARE_FIELD_IDS[$('careType').value];
  if(selected) $(selected).hidden=false;
}

function resetCareForm(){
  ['waterAmount','pesticideName','pesticideTarget','pesticideDilution','pesticideNextDate',
   'potType','potSize','soilMix','repotReason','fertilizerName','fertilizerAmount',
   'plantHeight','trunkWidth','leafCount','waterNote'].forEach(id=>$(id).value='');
  $('waterType').value='たっぷり灌水';
  $('fertilizer').value='なし';
  $('pesticideMethod').value='散布';
  $('fertilizerForm').value='液肥';
  $('rootPruned').checked=false;
  $('carePhoto').value='';
  $('photoPreview').src='';
  $('photoPreview').style.display='none';
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('写真を読み込めませんでした'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('この写真形式は読み込めませんでした'));
      img.onload=()=>{
        const maxSide=900;
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

window.openCare=id=>{
  currentId=id;
  const p=data.plants.find(x=>x.id===id);
  $('careTitle').textContent=`${p.name} のケア記録`;
  $('careType').value='水やり';
  resetCareForm();
  toggleCareFields();
  $('careDialog').showModal();
};
$('careType').onchange=toggleCareFields;
$('carePhoto').onchange=()=>{
  const file=$('carePhoto').files[0];
  if(!file){
    $('photoPreview').style.display='none';
    return;
  }
  const url=URL.createObjectURL(file);
  $('photoPreview').src=url;
  $('photoPreview').style.display='block';
  $('photoPreview').onload=()=>URL.revokeObjectURL(url);
};
$('cancelCare').onclick=()=> $('careDialog').close();
$('saveCare').onclick=async()=>{
  const p=data.plants.find(x=>x.id===currentId);
  const care=$('careType').value;
  if(care==='薬剤散布' && !$('pesticideName').value.trim()) return alert('薬剤名を入力してください');
  if(care==='施肥' && !$('fertilizerName').value.trim()) return alert('肥料名を入力してください');

  const details={};
  if(care==='水やり') Object.assign(details,{waterAmount:$('waterAmount').value.trim()});
  if(care==='薬剤散布') Object.assign(details,{
    name:$('pesticideName').value.trim(),target:$('pesticideTarget').value.trim(),
    dilution:$('pesticideDilution').value.trim(),method:$('pesticideMethod').value,
    nextDate:$('pesticideNextDate').value
  });
  if(care==='植え替え') Object.assign(details,{
    potType:$('potType').value.trim(),potSize:$('potSize').value.trim(),
    soilMix:$('soilMix').value.trim(),rootPruned:$('rootPruned').checked,
    reason:$('repotReason').value.trim()
  });
  if(care==='施肥') Object.assign(details,{
    name:$('fertilizerName').value.trim(),form:$('fertilizerForm').value,
    amount:$('fertilizerAmount').value.trim()
  });
  if(care==='状態・写真記録') Object.assign(details,{
    height:$('plantHeight').value.trim(),trunkWidth:$('trunkWidth').value.trim(),
    leafCount:$('leafCount').value.trim()
  });

  let photo='';
  const photoFile=$('carePhoto').files[0];
  if(care==='状態・写真記録' && photoFile){
    $('saveCare').disabled=true;
    $('saveCare').textContent='写真を処理中…';
    try{ photo=await compressImage(photoFile); }
    catch(e){ alert(e.message); return; }
    finally{
      $('saveCare').disabled=false;
      $('saveCare').textContent='記録する';
    }
  }

  const log={
    time:Date.now(),
    care,
    type:care==='水やり' ? $('waterType').value : care,
    fertilizer:care==='水やり' ? $('fertilizer').value : 'なし',
    details,
    note:$('waterNote').value.trim(),
    photo
  };
  p.logs.unshift(log);
  if(save()) $('careDialog').close();
  else p.logs.shift();
};

function careDetailHtml(l){
  const care=l.care || '水やり';
  const d=l.details || {};
  const parts=[];
  if(care==='水やり'){
    parts.push(`方法：${esc(l.type || '通常')}`);
    parts.push(`液肥：${esc(l.fertilizer || 'なし')}`);
    if(d.waterAmount) parts.push(`量：${esc(d.waterAmount)}`);
  }
  if(care==='薬剤散布'){
    if(d.name) parts.push(`薬剤：${esc(d.name)}`);
    if(d.target) parts.push(`対象：${esc(d.target)}`);
    if(d.dilution) parts.push(`希釈：${esc(d.dilution)}`);
    if(d.method) parts.push(`方法：${esc(d.method)}`);
    if(d.nextDate) parts.push(`次回：${esc(d.nextDate)}`);
  }
  if(care==='植え替え'){
    if(d.potType || d.potSize) parts.push(`鉢：${esc([d.potType,d.potSize].filter(Boolean).join(' '))}`);
    if(d.soilMix) parts.push(`用土：${esc(d.soilMix)}`);
    if(d.rootPruned) parts.push('根切り・根整理：あり');
    if(d.reason) parts.push(`理由：${esc(d.reason)}`);
  }
  if(care==='施肥'){
    if(d.name) parts.push(`肥料：${esc(d.name)}`);
    if(d.form) parts.push(`種類：${esc(d.form)}`);
    if(d.amount) parts.push(`希釈・量：${esc(d.amount)}`);
  }
  if(care==='状態・写真記録'){
    if(d.height) parts.push(`高さ：${esc(d.height)}`);
    if(d.trunkWidth) parts.push(`幹・茎：${esc(d.trunkWidth)}`);
    if(d.leafCount) parts.push(`葉数：${esc(d.leafCount)}`);
  }
  if(l.note) parts.push(`メモ：${esc(l.note)}`);
  return parts.join('<br>') || '詳細なし';
}

function photoHtml(photo){
  if(!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(photo || '')) return '';
  return `<img class="history-photo" src="${photo}" alt="成長記録の写真">`;
}

const CARE_CLASSES={
  '水やり':'water','薬剤散布':'pesticide','植え替え':'repot',
  '施肥':'fertilize','状態・写真記録':'growth'
};
let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let selectedCalendarDate=dateKey(new Date());

function dateKey(date){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,'0');
  const d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function renderCalendarFilters(){
  const select=$('calendarPlantFilter');
  const current=select.value;
  select.innerHTML='<option value="">すべての植物</option>'+data.plants.map(p=>
    `<option value="${esc(p.id)}">${esc(p.name)}</option>`
  ).join('');
  if([...select.options].some(o=>o.value===current)) select.value=current;
}

function calendarEventsFor(date){
  const plantId=$('calendarPlantFilter').value;
  const careFilter=$('calendarCareFilter').value;
  const events=[];
  data.plants.filter(p=>!plantId || p.id===plantId).forEach(p=>{
    (p.logs || []).forEach(log=>{
      const care=log.care || '水やり';
      if((!careFilter || care===careFilter) && dateKey(new Date(log.time))===date){
        events.push({plant:p,log,care,planned:false});
      }
      if(care==='薬剤散布' && (!careFilter || careFilter==='薬剤散布') && log.details?.nextDate===date){
        events.push({plant:p,log,care,planned:true});
      }
    });
  });
  return events.sort((a,b)=>Number(a.planned)-Number(b.planned) || b.log.time-a.log.time);
}

function renderCalendar(){
  const year=calendarMonth.getFullYear();
  const month=calendarMonth.getMonth();
  $('calendarTitle').textContent=`${year}年 ${month+1}月`;
  const first=new Date(year,month,1);
  const start=new Date(year,month,1-first.getDay());
  const today=dateKey(new Date());
  const weekdays=['日','月','火','水','木','金','土'];
  let html=weekdays.map(day=>`<div class="weekday">${day}</div>`).join('');

  for(let i=0;i<42;i++){
    const day=new Date(start);
    day.setDate(start.getDate()+i);
    const key=dateKey(day);
    const events=calendarEventsFor(key);
    const markers=events.slice(0,5).map(event=>{
      if(event.planned) return '<i class="event-dot planned" title="予定"></i>';
      const photo=event.log.photo ? '<span class="photo-mark">📷</span>' : '';
      return `<i class="event-dot ${CARE_CLASSES[event.care] || 'growth'}"></i>${photo}`;
    }).join('');
    const more=events.length>5?`<span class="more-mark">+${events.length-5}</span>`:'';
    const classes=['calendar-day'];
    if(day.getMonth()!==month) classes.push('other');
    if(key===today) classes.push('today');
    if(key===selectedCalendarDate) classes.push('selected');
    html+=`<button class="${classes.join(' ')}" onclick="selectCalendarDate('${key}')">
      <span class="day-number">${day.getDate()}</span><span class="event-dots">${markers}${more}</span>
    </button>`;
  }
  $('calendarGrid').innerHTML=html;
  renderCalendarDayDetails();
}

function renderCalendarDayDetails(){
  const events=calendarEventsFor(selectedCalendarDate);
  const date=new Date(`${selectedCalendarDate}T00:00:00`);
  const title=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(date);
  $('calendarDayDetails').innerHTML=`<h3>${title}</h3>`+(events.length?events.map(event=>{
    if(event.planned){
      return `<div class="calendar-entry"><div class="entry-title">⏰ ${esc(event.plant.name)}・薬剤散布予定</div>
        <div class="entry-meta">薬剤：${esc(event.log.details?.name || '未入力')} ／ 対象：${esc(event.log.details?.target || '未入力')}</div></div>`;
    }
    return `<div class="calendar-entry"><div class="entry-title">${esc(event.plant.name)}・${esc(event.care)}</div>
      <div class="entry-meta">${careDetailHtml(event.log)}</div>${photoHtml(event.log.photo)}</div>`;
  }).join(''):'<div class="empty">この日の記録・予定はありません。</div>');
}

window.selectCalendarDate=date=>{
  selectedCalendarDate=date;
  renderCalendar();
};

function setView(view){
  const calendar=view==='calendar';
  $('listView').classList.toggle('hidden',calendar);
  $('calendarView').classList.toggle('hidden',!calendar);
  $('listViewBtn').classList.toggle('active',!calendar);
  $('calendarViewBtn').classList.toggle('active',calendar);
  if(calendar){
    renderCalendarFilters();
    renderCalendar();
  }
}

$('listViewBtn').onclick=()=>setView('list');
$('calendarViewBtn').onclick=()=>setView('calendar');
$('prevMonth').onclick=()=>{
  calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);
  selectedCalendarDate=dateKey(calendarMonth);
  renderCalendar();
};
$('nextMonth').onclick=()=>{
  calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);
  selectedCalendarDate=dateKey(calendarMonth);
  renderCalendar();
};
$('todayBtn').onclick=()=>{
  const today=new Date();
  calendarMonth=new Date(today.getFullYear(),today.getMonth(),1);
  selectedCalendarDate=dateKey(today);
  renderCalendar();
};
$('calendarPlantFilter').onchange=renderCalendar;
$('calendarCareFilter').onchange=renderCalendar;

window.showHistory=id=>{
  const p=data.plants.find(x=>x.id===id);
  $('historyTitle').textContent=`${p.name} の履歴`;
  $('historyList').innerHTML=(p.logs?.length?p.logs.map((l,i)=>`
    <div class="history-item">
      <div class="history-title">${fmtDate(l.time)} ・ ${esc(l.care || '水やり')}</div>
      <div class="history-note">${careDetailHtml(l)}</div>
      ${photoHtml(l.photo)}
      <button class="danger" style="margin-top:7px;padding:7px 10px;font-size:12px"
        onclick="removeLog('${id}',${i})">この記録を削除</button>
    </div>`).join(''):'<div class="empty">履歴はまだありません。</div>');
  $('historyDialog').showModal();
};
$('closeHistory').onclick=()=> $('historyDialog').close();

window.copyShortcutUrl=async id=>{
  const p=data.plants.find(x=>x.id===id);
  const base=location.origin + location.pathname;
  const url=base + '?water=' + encodeURIComponent(id);
  try{
    await navigator.clipboard.writeText(url);
    toast(`「${p.name}」のURLをコピーしました`);
  }catch(e){
    prompt('このURLをコピーしてください', url);
  }
};

window.removePlant=id=>{
  const p=data.plants.find(x=>x.id===id);
  if(confirm(`「${p.name}」を削除しますか？\nケア履歴も削除されます。`)){
    data.plants=data.plants.filter(x=>x.id!==id);
    save();
  }
};
window.removeLog=(id,index)=>{
  if(!confirm('このケア記録を削除しますか？')) return;
  const p=data.plants.find(x=>x.id===id);
  p.logs.splice(index,1);
  save();
  showHistory(id);
};

$('menuBtn').onclick=e=>{
  e.stopPropagation();
  const willOpen=$('dataMenu').hidden;
  closePlantMenus();
  $('dataMenu').hidden=!willOpen;
  $('menuBtn').setAttribute('aria-expanded',String(willOpen));
};

function closeDataMenu(){
  $('dataMenu').hidden=true;
  $('menuBtn').setAttribute('aria-expanded','false');
}

function closePlantMenus(){
  document.querySelectorAll('[data-plant-menu]').forEach(menu=>{
    menu.classList.remove('open');
    const panel=menu.querySelector('.menu-panel');
    const button=menu.querySelector('.plant-menu-button');
    if(panel) panel.hidden=true;
    if(button) button.setAttribute('aria-expanded','false');
  });
}

window.togglePlantMenu=(id,e)=>{
  e.stopPropagation();
  const panel=$(`plantMenu-${id}`);
  const button=$(`plantMenuBtn-${id}`);
  const willOpen=panel.hidden;
  closeDataMenu();
  closePlantMenus();
  if(willOpen){
    panel.hidden=false;
    button.setAttribute('aria-expanded','true');
    panel.parentElement.classList.add('open');
  }
};

document.addEventListener('click',e=>{
  if(!$('menuWrap').contains(e.target)) closeDataMenu();
  closePlantMenus();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closeDataMenu();
    closePlantMenus();
  }
});

$('exportBtn').onclick=()=>{
  closeDataMenu();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='plant-care-log-backup.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

$('importBtn').onclick=()=>{
  closeDataMenu();
  $('importFile').click();
};

$('importFile').onchange=async()=>{
  const file=$('importFile').files[0];
  if(!file) return;

  try{
    const restored=JSON.parse(await file.text());
    const valid=restored && Array.isArray(restored.plants) && restored.plants.every(p=>
      p && typeof p==='object' &&
      (typeof p.id==='string' || typeof p.id==='number') &&
      typeof p.name==='string' &&
      (!('logs' in p) || Array.isArray(p.logs))
    );
    if(!valid) throw new Error('invalid backup');

    const currentCount=data.plants.length;
    const restoredCount=restored.plants.length;
    if(!confirm(
      `現在の${currentCount}株のデータを、バックアップの${restoredCount}株で上書きします。\n復元しますか？`
    )) return;

    restored.plants.forEach(p=>{ if(!Array.isArray(p.logs)) p.logs=[]; });
    const previous=data;
    data=restored;
    if(save()){
      toast(`${restoredCount}株のデータを復元しました`);
    }else{
      data=previous;
      render();
    }
  }catch(e){
    alert('バックアップファイルを読み込めませんでした。植物ケア記録で保存したJSONファイルを選んでください。');
  }finally{
    $('importFile').value='';
  }
};

function autoRecordFromUrl(){
  const params=new URLSearchParams(location.search);
  const id=params.get('water');
  if(!id) return;

  const p=data.plants.find(x=>x.id===id);
  if(!p){
    history.replaceState({},'',location.pathname);
    setTimeout(()=>toast('対象の株が見つかりませんでした'),100);
    return;
  }

  const last=p.logs?.[0];
  const now=Date.now();

  // 再読み込みによる二重記録を防ぐため、10秒以内は重複させない
  if(!last || now-last.time>10000){
    p.logs.unshift({
      time:now,
      care:'水やり',
      type:'通常',
      fertilizer:'なし',
      note:'iPhoneショートカットから自動記録'
    });
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  history.replaceState({},'',location.pathname);
  setTimeout(()=>toast(`💧 ${p.name} の水やりを記録しました`),100);
}

autoRecordFromUrl();
render();
</script>
